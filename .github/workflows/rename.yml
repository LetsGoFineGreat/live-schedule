name: Rename live schedule file
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/rename.yml]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f live-schedule-index.html ]; then git mv live-schedule-index.html index.html; git commit -m "Rename live-schedule-index.html to index.html"; git push; else echo "already renamed"; fi
